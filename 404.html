<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Monish Kumar V R</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/IBMPlexMono-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">

<script>
  (function () {
    var stored = localStorage.getItem("theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<header class="site-header">
  <nav class="site-nav" aria-label="Primary">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
    </ul>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" aria-pressed="false">
      <span aria-hidden="true">◐</span>
    </button>
  </nav>
</header>

<main id="content">
  <div class="wrap">

    <section class="character-theme not-found">
      <div class="character-frame">
        <img id="character-static" src="assets/character/404-turn/f00.jpg" width="240" height="240" alt="Illustrated character of Monish turning a laptop around to show an error" loading="eager">
        <canvas id="character-canvas" width="240" height="240" aria-hidden="true"></canvas>
      </div>

      <p class="prompt"><span class="accent">$</span> cd /this-page</p>
      <h1 class="name">404</h1>
      <p class="lede">That page doesn't exist. She's just shown you the same thing her screen says.</p>
      <p><a href="index.html">&larr; back to the homepage</a></p>
    </section>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Built without a framework.</p>
    <p>HTML · CSS · JavaScript</p>
    <p>© 2026 Monish Kumar V R</p>
  </div>
</footer>

<script src="character.js"></script>
<script>
  (function () {
    var toggle = document.getElementById("theme-toggle");
    var root = document.documentElement;
    function syncPressed() {
      toggle.setAttribute("aria-pressed", root.getAttribute("data-theme") === "dark" ? "true" : "false");
    }
    syncPressed();
    toggle.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      syncPressed();
    });
  })();

  (function () {
    var canvas = document.getElementById("character-canvas");
    var img = document.getElementById("character-static");
    if (!canvas || !img || typeof createCharacterPlayer !== "function") return;
    var player = createCharacterPlayer(canvas, img, { fps: 18 });
    var frames = ["f00", "f01", "f02", "f03", "f04", "f05", "f06", "f07"].map(
      function (n) { return "assets/character/404-turn/" + n + ".jpg"; }
    );
    player.loadClip("turn", frames);
    player.play("turn", { mode: "times", times: 1, holdIndex: frames.length - 1 });
  })();
</script>
</body>
</html>
